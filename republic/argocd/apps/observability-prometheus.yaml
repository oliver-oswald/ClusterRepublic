apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: republic
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.5.1        # CHANGEME if you pin a different version
    helm:
      values: |
        # The Truth System: Prometheus, Alertmanager, Grafana, node-exporter,
        # kube-state-metrics. Lives in the Ministry of Statistics.
        grafana:
          adminPassword: CHANGEME-grafana   # CHANGEME (use a Secret)
          defaultDashboardsEnabled: true
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard      # dashboards ConfigMaps opt in via this label
              searchNamespace: ALL
        prometheus:
          prometheusSpec:
            retention: 15d
            # Discover ServiceMonitors/PodMonitors in ALL namespaces, not just
            # those with a release label, so every ministry is observed.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi         # CHANGEME
  destination:
    server: https://kubernetes.default.svc
    namespace: ministry-statistics
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # kube-prometheus-stack CRDs are very large
