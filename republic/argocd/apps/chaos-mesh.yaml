apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: republic
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    targetRevision: 2.7.0         # CHANGEME if you pin a different version
    helm:
      values: |
        # Ministry of Emergency Events. Fault injection, opt-in per namespace.
        dashboard:
          create: true
        chaosDaemon:
          runtime: containerd
          socketPath: /run/k3s/containerd/containerd.sock   # CHANGEME for non-k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: ministry-emergency-events
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
