apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-metallb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: republic
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: 0.14.9        # CHANGEME if you pin a different version
    helm:
      values: |
        # MetalLB controller + speaker. Layer-2 mode config lives in
        # infrastructure-metallb-config (applied one wave later).
        speaker:
          frr:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true     # MetalLB CRDs are large
