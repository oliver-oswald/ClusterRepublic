apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-dashboards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: republic
  source:
    repoURL: https://github.com/CHANGEME/republic.git   # CHANGEME
    targetRevision: HEAD
    path: republic/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: ministry-statistics
  syncPolicy:
    automated: { prune: true, selfHeal: true }
