apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-central-committee
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: republic
  source:
    repoURL: https://github.com/CHANGEME/republic.git   # CHANGEME
    targetRevision: HEAD
    path: republic/ai-central-committee/base
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-central-committee
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
