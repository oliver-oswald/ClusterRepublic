# The governance engine — a FastAPI service that reads the Truth System and the
# Kubernetes API (read-only) and emits advisory Five-Year Plans. Source lives in
# republic/ai-central-committee/app/. Build & push the image, then set it here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-engine-config
  namespace: ai-central-committee
data:
  PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.ministry-statistics.svc.cluster.local:9090"
  OLLAMA_URL: "http://ollama.ai-central-committee.svc.cluster.local:11434"
  REDIS_URL: "redis://redis.ai-central-committee.svc.cluster.local:6379/0"
  MODEL: "llama3.2:1b"          # CHANGEME — small model for CPU homelabs
  DELIBERATION_INTERVAL: "3600" # seconds between Five-Year Plans
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-engine
  namespace: ai-central-committee
  labels: { app: governance-engine }
spec:
  replicas: 1
  selector: { matchLabels: { app: governance-engine } }
  template:
    metadata:
      labels: { app: governance-engine }
    spec:
      serviceAccountName: governance-engine    # read-only identity (see rbac.yaml)
      priorityClassName: republic-vanguard
      containers:
        - name: governance-engine
          image: ghcr.io/CHANGEME/governance-engine:0.1.0   # CHANGEME (see docs/DEPLOYMENT.md)
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: governance-engine-config }
          env:
            - name: PG_HOST
              value: postgres.ai-central-committee.svc.cluster.local
            - name: PG_USER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
            - name: PG_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
            - name: PG_DB
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits:   { cpu: "1",    memory: 1Gi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: governance-engine
  namespace: ai-central-committee
  labels: { app: governance-engine }
spec:
  selector: { app: governance-engine }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Let the Truth System scrape the engine's own /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: governance-engine
  namespace: ai-central-committee
  labels: { app: governance-engine }
spec:
  selector:
    matchLabels: { app: governance-engine }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
