# PostgreSQL — the Committee's long-term memory: plans, deliberation history.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ai-central-committee
type: Opaque
stringData:
  POSTGRES_DB: committee
  POSTGRES_USER: committee
  POSTGRES_PASSWORD: CHANGEME-postgres   # CHANGEME (use a sealed-secret in real use)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ai-central-committee
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi            # CHANGEME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-central-committee
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - { name: pg, containerPort: 5432 }
          envFrom:
            - secretRef: { name: postgres-credentials }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits:   { cpu: "1",    memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "committee"] }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-central-committee
spec:
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: pg }
