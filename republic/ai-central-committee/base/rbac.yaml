# Constitutional safeguard (Article 4): the Central Committee may LOOK at the
# whole Republic but may CHANGE nothing. Read-only verbs only. There is no
# RoleBinding anywhere granting this identity create/update/patch/delete.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-engine
  namespace: ai-central-committee
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: central-committee-readonly
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes, services, resourcequotas, events, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: central-committee-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: central-committee-readonly
subjects:
  - kind: ServiceAccount
    name: governance-engine
    namespace: ai-central-committee
