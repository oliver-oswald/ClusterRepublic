# Redis — short-term deliberation cache (ephemeral; no persistence needed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-central-committee
  labels: { app: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: "50m",  memory: 64Mi }
            limits:   { cpu: "500m", memory: 256Mi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-central-committee
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
