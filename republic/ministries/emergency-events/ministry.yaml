# 🔥 Ministry of Emergency Events
# Home of Chaos Mesh (synced by its own ArgoCD app into this namespace) and the
# chaos experiments. Low priority by default — disruption is its job, not survival.
apiVersion: v1
kind: Namespace
metadata:
  name: ministry-emergency-events
  labels:
    republic.io/ministry: "true"
    republic.io/name: emergency-events
    pod-security.kubernetes.io/enforce: privileged   # chaos-daemon needs host access
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ministry-emergency-events
spec:
  hard:
    requests.cpu: "2"          # CHANGEME
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ministry-emergency-events
spec:
  limits:
    - type: Container
      default:        { cpu: "200m", memory: 256Mi }
      defaultRequest: { cpu: "50m",  memory: 64Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minister
  namespace: ministry-emergency-events
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ministry-laws
  namespace: ministry-emergency-events
data:
  charter: |
    The Ministry of Emergency Events tests the resilience of the State by
    manufacturing crises: pod purges, network delays, node stress. All events
    are bounded, scheduled, and observable. A Republic untested is a Republic
    unprepared.
  motto: "Stability is forged in scheduled catastrophe."
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ministry-emergency-events
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-chaos-control
  namespace: ministry-emergency-events
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - {}                      # dashboard + controller-manager webhooks
  egress:
    - {}                      # chaos-daemon must reach targets cluster-wide + API
