# 🌾 Ministry of Agriculture (Storage)
# Backing store for the Republic: Longhorn volumes + MinIO (National Archive).
# NOTE: MinIO (infrastructure-minio) syncs at an earlier wave and creates this
# namespace; this manifest then adopts it and applies quota/borders. Keep the
# quota generous enough not to evict the storage workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: ministry-agriculture
  labels:
    republic.io/ministry: "true"
    republic.io/name: agriculture
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: ministry-agriculture
spec:
  hard:
    requests.cpu: "4"          # CHANGEME
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "30"
    pods: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: ministry-agriculture
spec:
  limits:
    - type: Container
      default:        { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minister
  namespace: ministry-agriculture
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ministry-laws
  namespace: ministry-agriculture
data:
  charter: |
    The Ministry of Agriculture safeguards the harvest (persistent data). It
    operates Longhorn replicated volumes and the MinIO National Archive.
    Storage growth is reported to the Truth System as "agricultural yield".
  motto: "Bread, land, and three-way replication."
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ministry-agriculture
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-and-intra
  namespace: ministry-agriculture
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: {} }]
  egress:
    - to: [{ podSelector: {} }]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Other ministries consume storage (e.g. MinIO S3 API) — allow them in, plus
# the Truth System for scraping.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-republic-ingress
  namespace: ministry-agriculture
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              republic.io/ministry: "true"
