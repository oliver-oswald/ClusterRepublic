# Example State Enterprise: "State Cinema".
# Demonstrates the §7 contract every citizen-service must honour:
#   - a tagged image (disallow-latest law)
#   - declared resource requests (planned-resources law)
#   - a health endpoint + exported production metrics
#   - a ServiceMonitor so the Truth System observes it automatically
#   - propaganda labels, for morale
#
# podinfo is used as a stand-in: it exposes /healthz and Prometheus /metrics.
# Swap it for Jellyfin (State Cinema), Immich (National Archive), etc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: state-cinema
  namespace: ministry-heavy-computing
  labels:
    app: state-cinema
    republic.io/enterprise: state-cinema
    republic.io/propaganda: "entertainment-of-the-masses"
spec:
  replicas: 2
  selector: { matchLabels: { app: state-cinema } }
  template:
    metadata:
      labels: { app: state-cinema }
    spec:
      priorityClassName: republic-normal
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.0
          ports:
            - { name: http, containerPort: 9898 }
          resources:
            requests: { cpu: "50m",  memory: 64Mi }
            limits:   { cpu: "200m", memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: state-cinema
  namespace: ministry-heavy-computing
  labels: { app: state-cinema }
spec:
  selector: { app: state-cinema }
  ports:
    - { name: http, port: 9898, targetPort: http }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: state-cinema
  namespace: ministry-heavy-computing
  labels: { app: state-cinema }
spec:
  selector:
    matchLabels: { app: state-cinema }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
