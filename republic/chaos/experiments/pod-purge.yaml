# Scheduled "political purge": kills one pod every 30 minutes, but ONLY in
# namespaces that have explicitly enlisted via the label
# republic.io/chaos-eligible=true. No ministry carries that label by default,
# so this is inert until you opt one in:
#
#   kubectl label ns ministry-heavy-computing republic.io/chaos-eligible=true
#
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: pod-purge
  namespace: ministry-emergency-events
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  historyLimit: 5
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces: []                       # cluster-wide, then narrowed by labels
      labelSelectors: {}
      namespaceSelectors:
        republic.io/chaos-eligible: "true"  # opt-in only
